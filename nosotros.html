<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tú y yo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdeef3; --bg2:#f6d9f0; --ink:#5a1f45; --muted:#8a4d6e;
    --pink:#c2407a; --gold:#b5577f; --lilac:#d9b8f2; --blush:#f4a7c6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg)}
  body{background:radial-gradient(120% 70% at 50% 0%, var(--bg2) 0%, var(--bg) 60%);min-height:100vh;overflow-x:hidden}
  main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:30px 22px 48px;min-height:100vh;display:flex;flex-direction:column}

  /* Corazones flotando de fondo */
  .floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .floaters svg{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}90%{opacity:.4}
                  100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:44px}
  .brand{font-family:"DM Serif Display",serif;font-style:italic;color:var(--gold);font-size:18px}

  .hero{text-align:center;margin-bottom:34px}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 10px}
  h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:62px;line-height:1;margin:0 0 10px}
  h1 em{color:var(--pink);font-size:.8em;display:inline-block;transform:translateY(-4px);margin:0 6px}
  .sub{font-family:Caveat,cursive;font-size:26px;color:var(--muted);margin:0}

  /* Polaroid principal */
  .polaroid{position:relative;margin:10px 10px 56px;background:#fff;padding:14px 14px 18px;border-radius:4px;
            box-shadow:0 2px 4px rgba(90,31,69,.08),0 22px 48px rgba(194,64,122,.25);transform:rotate(-2deg);
            animation:drop 1s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(-8deg) scale(.95)}to{opacity:1;transform:rotate(-2deg)}}
  .tape{position:absolute;top:-12px;width:96px;height:26px;border-radius:2px;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .tape.a{left:50%;margin-left:-48px;background:rgba(244,167,198,.78);transform:rotate(-3deg)}
  /* Slideshow */
  .show{position:relative;aspect-ratio:4/5;border-radius:2px;overflow:hidden;background:#f9e6ef;touch-action:pan-y}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .slide.on{opacity:1;z-index:1}
  .slide .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(20px) saturate(1.2);opacity:.75}
  .slide img{position:relative;display:block;width:100%;height:100%;object-fit:contain;transform:scale(1.06);transition:transform 6s ease-out}
  .slide.on img{transform:scale(1)}
  .show .ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
            color:var(--muted);font-size:14px;background:repeating-linear-gradient(45deg,#fbe9f1 0 12px,#f8e0ec 12px 24px)}
  .show.empty .ph{display:flex}
  .nav{position:absolute;top:50%;z-index:2;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:0;cursor:pointer;
       background:rgba(255,255,255,.88);color:var(--pink);display:flex;align-items:center;justify-content:center;
       box-shadow:0 4px 12px rgba(90,31,69,.2);transition:transform .15s}
  .nav:active{transform:scale(.9)}
  .nav.prev{left:10px}.nav.next{right:10px}
  .count{position:absolute;top:10px;left:10px;z-index:2;background:rgba(90,31,69,.55);color:#fff;font-size:12px;font-weight:600;
         padding:4px 10px;border-radius:999px;letter-spacing:.04em}
  .show.single .nav,.show.single .count,.show.empty .nav,.show.empty .count{display:none}
  .sdots{display:flex;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .sdots button{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sdots button::after{content:"";width:8px;height:8px;border-radius:999px;background:rgba(194,64,122,.28);transition:all .35s}
  .sdots button.on::after{width:22px;background:var(--pink)}
  figcaption{font-family:Caveat,cursive;font-size:30px;text-align:center;margin-top:4px;line-height:1.15;min-height:35px;transition:opacity .4s}
  figcaption.fade{opacity:0}
  .doodle{position:absolute;z-index:3;pointer-events:none}
  .doodle.heart{right:-22px;bottom:34px;width:70px;height:64px;color:var(--pink);transform:rotate(14deg);
                filter:drop-shadow(0 4px 6px rgba(194,64,122,.3));animation:beat 1.8s ease-in-out infinite}
  .doodle.flower{left:-20px;top:28%;width:46px;height:46px;color:var(--lilac);transform:rotate(-15deg)}
  .doodle.flower2{left:6px;top:calc(28% + 34px);width:26px;height:26px;color:var(--blush)}
  .doodle.sparkle{right:22px;top:-22px;width:30px;height:30px;color:#f2b84b;animation:twinkle 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:rotate(14deg) scale(1)}15%{transform:rotate(14deg) scale(1.15)}30%{transform:rotate(14deg) scale(1)}45%{transform:rotate(14deg) scale(1.1)}}
  @keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.5;transform:scale(.75) rotate(20deg)}}

  /* La carta */
  .letter{position:relative;background:#fffafc;border-radius:18px;padding:52px 26px 30px;
          box-shadow:0 16px 38px rgba(194,64,122,.18);transform:rotate(.6deg);
          background-image:repeating-linear-gradient(transparent 0 33px,rgba(194,64,122,.10) 33px 34px);background-position:0 68px}
  .letter::before{content:"";position:absolute;inset:9px;border:1.5px dashed rgba(194,64,122,.28);border-radius:12px;pointer-events:none}
  .seal{position:absolute;top:-30px;left:50%;margin-left:-30px;width:60px;height:60px;border-radius:50%;
        background:radial-gradient(circle at 35% 30%,#e0679c 0%,var(--pink) 55%,#9c2c5f 100%);
        box-shadow:0 6px 16px rgba(156,44,95,.45),inset 0 -3px 6px rgba(0,0,0,.18);
        display:flex;align-items:center;justify-content:center;color:#fff}
  .seal::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35)}
  .greet{font-family:Caveat,cursive;font-size:38px;color:var(--pink);margin:0 0 6px;line-height:1}
  .body{font-size:17px;line-height:34px;margin:0;white-space:pre-line}
  .sign{font-family:Caveat,cursive;font-size:32px;color:var(--pink);text-align:right;margin:18px 0 0;line-height:1.1}

  .kiss{margin-top:40px;text-align:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;
       background:var(--pink);color:#fff;font-weight:600;font-size:16px;border:0;cursor:pointer;font-family:inherit;
       box-shadow:0 8px 20px rgba(194,64,122,.35);transition:transform .15s}
  .btn:active{transform:scale(.95)}
  .burst{position:fixed;pointer-events:none;z-index:5;color:var(--pink);animation:pop 1.3s ease-out forwards}
  @keyframes pop{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r))}}

  .foot{margin-top:auto;padding-top:44px;font-size:13px;color:var(--muted);opacity:.75;text-align:center}

  .reveal{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.3,1)}
  .reveal.in{opacity:1;transform:rotate(.6deg)}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}.reveal{opacity:1;transform:none;transition:none}.floaters{display:none}
  }
</style>
</head>
<body>
<div class="floaters" id="floaters" aria-hidden="true"></div>

<main>
  <div class="top">
    <a class="back" href="index.html#final-z9d3">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Volver
    </a>
    <span class="brand">Solo para ti</span>
  </div>

  <header class="hero">
    <p class="eyebrow">De mí, para ti</p>
    <h1>Tú <em>&amp;</em> yo</h1>
    <p class="sub">mi lugar favorito en el mundo</p>
  </header>

  <!-- ===== NUESTRAS FOTOS (slideshow) =====
       Las fotos y sus frases se cambian en la lista FOTOS, dentro del <script> al final. -->
  <figure class="polaroid">
    <span class="tape a"></span>
    <div class="show" id="show" aria-roledescription="carrusel" aria-label="Nuestras fotos">
      <span class="ph">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
        Aquí van nuestras fotos<br>(fotos/nosotros1.jpg, nosotros2.jpg…)
      </span>
      <span class="count" id="count"></span>
      <button class="nav prev" id="prev" type="button" aria-label="Foto anterior">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav next" id="next" type="button" aria-label="Foto siguiente">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="sdots" id="sdots"></div>
    <figcaption id="cap">nosotros ♥</figcaption>

    <svg class="doodle heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <svg class="doodle flower" viewBox="0 0 40 40" aria-hidden="true"><use href="#flor"/></svg>
    <svg class="doodle flower2" viewBox="0 0 40 40" aria-hidden="true"><use href="#flor"/></svg>
    <svg class="doodle sparkle" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z"/></svg>
  </figure>

  <!-- ===== TU MENSAJE =====
       Escribe tu mensaje donde dice [ ... ]. Los saltos de línea se respetan. -->
  <article class="letter reveal" id="letter">
    <span class="seal" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </span>
    <p class="greet">Mi amor,</p>
    <p class="body">[Aquí va tu mensaje.

Puedes escribir varios párrafos dejando una línea en blanco entre ellos.]</p>
    <p class="sign">Te amo,<br>Jessy</p>
  </article>

  <div class="kiss">
    <button class="btn" id="kiss" type="button">
      Mándame un beso
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </button>
  </div>

  <p class="foot">Hecho con amor, solo para ti.</p>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flor" viewBox="0 0 40 40">
    <g fill="currentColor">
      <ellipse cx="20" cy="9" rx="7" ry="9"/>
      <ellipse cx="20" cy="9" rx="7" ry="9" transform="rotate(72 20 20)"/>
      <ellipse cx="20" cy="9" rx="7" ry="9" transform="rotate(144 20 20)"/>
      <ellipse cx="20" cy="9" rx="7" ry="9" transform="rotate(216 20 20)"/>
      <ellipse cx="20" cy="9" rx="7" ry="9" transform="rotate(288 20 20)"/>
    </g>
    <circle cx="20" cy="20" r="5.5" fill="#ffd36e"/>
  </symbol>
</svg>

<script>
  // ===== TUS FOTOS =====
  // Pon las fotos en la carpeta "fotos" y escribe aquí el nombre y una frasecita para cada una.
  // Puedes añadir o quitar líneas. Si una foto no existe, simplemente se salta.
  var FOTOS = [
    { src:"fotos/nosotros1.png", texto:"nosotros ♥" },
    { src:"fotos/nosotros2.png", texto:"[frase para la foto 2]" },
    { src:"fotos/nosotros3.png", texto:"[frase para la foto 3]" },
    { src:"fotos/nosotros4.png", texto:"[frase para la foto 4]" },
    { src:"fotos/nosotros5.png", texto:"[frase para la foto 5]" }
  ];
  var SEGUNDOS_POR_FOTO = 5;

  (function(){
    var show=document.getElementById("show"), dotsBox=document.getElementById("sdots"),
        cap=document.getElementById("cap"), count=document.getElementById("count");
    var slides=[], cur=0, timer=null;

    FOTOS.forEach(function(f){
      var s=document.createElement("div"); s.className="slide"; s.dataset.texto=f.texto||"";
      var bg=document.createElement("div"); bg.className="bg"; bg.style.backgroundImage="url('"+f.src+"')";
      var img=document.createElement("img"); img.src=f.src; img.alt=f.texto||"Nosotros";
      img.onerror=function(){ s.remove(); rebuild(); };
      s.appendChild(bg); s.appendChild(img);
      show.insertBefore(s, count); // en el mismo orden que la lista
    });

    function rebuild(){
      slides=Array.prototype.slice.call(show.querySelectorAll(".slide"));
      show.classList.toggle("empty", slides.length===0);
      show.classList.toggle("single", slides.length===1);
      dotsBox.innerHTML="";
      if(slides.length>1) slides.forEach(function(_,i){
        var b=document.createElement("button"); b.type="button"; b.setAttribute("aria-label","Foto "+(i+1));
        b.onclick=function(){ go(i,true); }; dotsBox.appendChild(b);
      });
      if(cur>=slides.length) cur=0;
      go(cur,false,true);
    }
    function go(i,user,silent){
      if(!slides.length){ cap.textContent="nosotros ♥"; return; }
      cur=(i+slides.length)%slides.length;
      slides.forEach(function(s,k){ s.classList.toggle("on",k===cur); });
      Array.prototype.forEach.call(dotsBox.children,function(d,k){ d.classList.toggle("on",k===cur); });
      count.textContent=(cur+1)+" / "+slides.length;
      var t=slides[cur].dataset.texto;
      if(silent){ cap.textContent=t; }
      else { cap.classList.add("fade"); setTimeout(function(){ cap.textContent=t; cap.classList.remove("fade"); },300); }
      if(user) restart();
    }
    function restart(){
      clearInterval(timer);
      timer=setInterval(function(){ if(slides.length>1) go(cur+1); }, SEGUNDOS_POR_FOTO*1000);
    }
    document.getElementById("prev").onclick=function(){ go(cur-1,true); };
    document.getElementById("next").onclick=function(){ go(cur+1,true); };
    // deslizar con el dedo
    var x0=null;
    show.addEventListener("touchstart",function(e){ x0=e.touches[0].clientX; },{passive:true});
    show.addEventListener("touchend",function(e){
      if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; x0=null;
      if(Math.abs(dx)>40) go(cur+(dx<0?1:-1),true);
    });
    rebuild(); restart();
  })();

  var HEART='<path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/>';
  var COLS=["#f4a7c6","#c2407a","#d9b8f2","#e889b2","#ffc2d6"];

  // Corazones que suben despacito por el fondo
  (function(){
    var box=document.getElementById("floaters");
    for(var i=0;i<14;i++){
      var s=12+Math.random()*20;
      var el=document.createElementNS("http://www.w3.org/2000/svg","svg");
      el.setAttribute("viewBox","0 0 24 24"); el.setAttribute("width",s); el.setAttribute("height",s);
      el.setAttribute("fill",COLS[i%COLS.length]); el.innerHTML=HEART;
      el.style.left=(Math.random()*100)+"vw";
      el.style.animationDuration=(11+Math.random()*10)+"s";
      el.style.animationDelay=(-Math.random()*18)+"s";
      box.appendChild(el);
    }
  })();

  // La carta aparece al bajar
  (function(){
    var l=document.getElementById("letter");
    if(!("IntersectionObserver" in window)){ l.classList.add("in"); return; }
    var io=new IntersectionObserver(function(e){ if(e[0].isIntersecting){ l.classList.add("in"); io.disconnect(); } },{threshold:.12});
    io.observe(l);
  })();

  // Lluvia de corazones al tocar el botón
  document.getElementById("kiss").onclick=function(ev){
    var r=this.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(var i=0;i<22;i++){
      var s=14+Math.random()*18, a=Math.random()*Math.PI*2, d=80+Math.random()*160;
      var el=document.createElementNS("http://www.w3.org/2000/svg","svg");
      el.setAttribute("viewBox","0 0 24 24"); el.setAttribute("width",s); el.setAttribute("height",s);
      el.setAttribute("fill",COLS[i%COLS.length]); el.setAttribute("class","burst"); el.innerHTML=HEART;
      el.style.left=(cx-s/2)+"px"; el.style.top=(cy-s/2)+"px";
      el.style.setProperty("--dx",Math.cos(a)*d+"px");
      el.style.setProperty("--dy",(Math.sin(a)*d-60)+"px");
      el.style.setProperty("--r",(Math.random()*80-40)+"deg");
      document.body.appendChild(el);
      setTimeout((function(n){return function(){n.remove()}})(el),1400);
    }
  };
</script>
</body>
</html>
